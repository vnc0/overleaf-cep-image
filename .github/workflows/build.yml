name: build

# Builds both images natively on amd64 and arm64 runners, publishes them to
# GHCR, merges each into one multi-arch tag, and attests build provenance.
on:
  push:
    branches: [main]
    paths:
      - upstream.env
      - texlive/**
      - git-bridge/**
      - scripts/**
      - .github/workflows/build.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io/vnc0

jobs:
  image:
    name: ${{ matrix.image }} (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 330
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - { image: overleaf-cep, arch: amd64, runner: ubuntu-24.04 }
          - { image: overleaf-cep, arch: arm64, runner: ubuntu-24.04-arm }
          - { image: overleaf-cep-git-bridge, arch: amd64, runner: ubuntu-24.04 }
          - { image: overleaf-cep-git-bridge, arch: arm64, runner: ubuntu-24.04-arm }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Only the TeX Live base build needs more than the ~14 GB a runner has free.
      # Clear space in the background so the build can start straight away.
      - name: Free disk space
        if: matrix.image == 'overleaf-cep'
        run: |
          sudo setsid nohup sh -c 'rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost' >/dev/null 2>&1 &
          df -h /

      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        run: scripts/build.sh "${{ matrix.image }}" "${{ matrix.arch }}" --push
        env:
          SOURCE_URL: ${{ github.server_url }}/${{ github.repository }}

  manifest:
    name: ${{ matrix.image }} (multi-arch)
    needs: image
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    strategy:
      matrix:
        image: [overleaf-cep, overleaf-cep-git-bridge]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Merge per-arch images into one multi-arch tag
        id: merge
        run: |
          . ./upstream.env
          tag="${VERSION}-r${REVISION}"
          name="${REGISTRY}/${{ matrix.image }}"
          docker buildx imagetools create \
            -t "${name}:${tag}" -t "${name}:${VERSION}" \
            "${name}:${tag}-amd64" "${name}:${tag}-arm64"
          digest="$(docker buildx imagetools inspect "${name}:${tag}" --format '{{json .Manifest.Digest}}' | tr -d '"')"
          echo "name=${name}" >> "$GITHUB_OUTPUT"
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"
          {
            echo "### ${{ matrix.image }}"
            echo
            echo '```'
            echo "${name}:${tag}@${digest}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.merge.outputs.name }}
          subject-digest: ${{ steps.merge.outputs.digest }}
          push-to-registry: true
