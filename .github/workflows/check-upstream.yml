name: check-upstream

# Weekly: if yu-i-i/overleaf-cep has a newer release than upstream.env, open an
# issue. A human decides what to pin; nothing is rebuilt automatically.
on:
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Compare with upstream tags
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          . ./upstream.env
          latest="$(gh api "repos/${UPSTREAM_REPO}/tags?per_page=100" --jq '[.[].name | select(test("^v[0-9.]+-ext-v[0-9.]+$"))][0]')"
          echo "pinned: v${VERSION}  latest: ${latest}"
          if [ -n "$latest" ] && [ "$latest" != "v${VERSION}" ]; then
            title="Upstream ${latest} is available"
            if [ -z "$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "\"$title\" in:title" --json number --jq '.[0].number')" ]; then
              gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" \
                --body "Pinned: v${VERSION}. Latest upstream tag: ${latest}. Update \`UPSTREAM_SHA\` and \`VERSION\` in \`upstream.env\`, reset \`REVISION\`, and push to main."
            fi
          fi
